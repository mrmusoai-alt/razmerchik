<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1'>
<title>Размерчик</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#141c30;--card2:#19243b;--text:#f3f6ff;--muted:#929db5;--line:rgba(160,177,220,.16);--gold:#a5b4fc;--accent:#6558f5;--accent2:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,rgba(101,88,245,.2),transparent 42%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:18px 16px 38px;letter-spacing:-.01em}
h1{font-size:27px;letter-spacing:-.045em;line-height:1.15;margin:8px 0 6px;font-weight:800}
.sub{color:var(--muted);font-size:14px;line-height:1.45;margin-bottom:20px}
.nav{display:flex;gap:5px;margin-bottom:24px;padding:5px;background:#10172a;border:1px solid var(--line);border-radius:15px}
.nav a{flex:1;text-align:center;padding:11px 8px;border-radius:11px;background:transparent;color:var(--muted);text-decoration:none;font-size:13px;font-weight:650;transition:background .2s,color .2s}
.nav a.on{background:linear-gradient(135deg,#8175ff,#5d55e9);color:white;box-shadow:0 5px 18px rgba(101,88,245,.24)}
.fig{display:flex;justify-content:center;align-items:center;min-height:190px;margin:8px 0 22px;padding:14px;border-radius:22px;background:linear-gradient(145deg,rgba(101,88,245,.12),rgba(20,28,48,.8));border:1px solid var(--line);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:var(--muted);font-size:14px;font-weight:600}
.val{font-size:30px;font-weight:800;color:var(--text);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.val small{font-size:13px;color:var(--muted);margin-left:5px;font-weight:500;letter-spacing:0}
.ctl{display:flex;align-items:center;gap:10px;margin-top:8px}
.ctl button{flex:0 0 42px;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:22px;font-weight:500;transition:transform .15s,background .15s}
.ctl button:active{transform:scale(.95);background:var(--card2)}
input[type=range]{flex:1;min-width:0;accent-color:#8175ff;height:28px}
.label{color:var(--text);font-size:14px;font-weight:750;margin:25px 0 10px;letter-spacing:-.01em}
.opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.opt{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 3px 9px;text-align:center;font-size:10px;line-height:1.25;font-weight:650;color:#c4cce0;transition:all .18s;overflow:hidden}
.opt svg{width:32px;height:51px;display:block;margin:0 auto 7px;fill:#8895b5;transition:fill .18s}
.opt.on{background:linear-gradient(160deg,rgba(101,88,245,.24),rgba(101,88,245,.1));border-color:#8175ff;color:#fff;box-shadow:inset 0 0 0 1px rgba(129,117,255,.14)}
.opt.on svg{fill:#b8b2ff}
#sil .opt{padding:12px 3px 11px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:10px}
#sil .opt svg{width:34px;height:49px;margin:0 auto;fill:none;stroke:#8795b8;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#sil .opt.on svg{fill:none;stroke:#c3bdff}
#bel.opts{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
#bel .opt{padding:12px 3px 11px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:10px}
#sil .opt svg,#bel .opt svg{width:38px;height:58px;display:block;margin:0 auto;fill:#8895b5;stroke:#8895b5;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
#sil .opt.on svg,#bel .opt.on svg{fill:#b8b2ff;stroke:#b8b2ff}
#bel .opt{min-height:90px}
@media(max-width:360px){#sil .opt{min-height:94px}#sil .opt svg,#bel .opt svg{width:32px;height:50px}#bel .opt{font-size:9px}}
.main{width:100%;margin-top:28px;padding:16px;border:0;border-radius:15px;background:linear-gradient(135deg,#8175ff,#5d55e9);color:#fff;font-size:15px;font-weight:750;letter-spacing:-.01em;box-shadow:0 9px 25px rgba(101,88,245,.24);transition:transform .15s,filter .15s}
.main:active{transform:scale(.985);filter:brightness(.95)}
.note{margin-top:13px;color:#a5b4fc;text-align:center;min-height:20px;font-size:13px;font-weight:600}
@media(max-width:360px){body{padding-left:12px;padding-right:12px}.opts{gap:5px}.opt{font-size:9px}.opt svg{width:29px}}
</style>
</head>
<body>
<div class='nav'><a class='on' href='index.html'>Профиль</a><a href='match.html'>Подбор размера</a></div>
<h1>Размерчик</h1>
<div class='sub'>Заполни профиль один раз — дальше подберём размер</div>

<div class='fig' id='fig'></div>

<div class='row'><span>Рост</span><span class='val'><span id='hv'>175</span><small>см</small></span></div>
<div class='ctl'><button data-t='h' data-d='-1'>−</button><input id='h' type='range' min='140' max='210' value='175'><button data-t='h' data-d='1'>+</button></div>

<div class='row'><span>Вес</span><span class='val'><span id='wv'>70</span><small>кг</small></span></div>
<div class='ctl'><button data-t='w' data-d='-1'>−</button><input id='w' type='range' min='40' max='150' value='70'><button data-t='w' data-d='1'>+</button></div>

<div class='label'>Тип фигуры</div>
<div class='sub' style='margin:-5px 0 10px'>Выбери форму, которая больше похожа на твою</div>
<div class='opts' id='sil'></div>

<div class='label'>Объём живота</div>
<div class='sub' style='margin:-5px 0 10px'>Выбери наиболее близкий вариант</div>
<div class='opts' id='bel'></div>

<button class='main' id='save'>Сохранить профиль</button>
<div class='note' id='note'></div>

<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
const SIL=[
{n:'Трапеция',s:18,w:12,h:11},
{n:'Атлет',s:21,w:12,h:13},
{n:'Прямой',s:15,w:15,h:15},
{n:'Груша',s:12,w:13,h:19},
{n:'Овал',s:15,w:20,h:16}
];
const BEL=[
{n:'Плоский',w:11},
{n:'Лёгкий',w:13},
{n:'Средний',w:16},
{n:'Заметный',w:19},
{n:'Большой',w:22}
];
function icon(s,w,h){
const shapes=[
{shoulder:18,waist:11,hip:13,torso:'taper'},
{shoulder:19,waist:10,hip:14,torso:'athletic'},
{shoulder:14,waist:13,hip:14,torso:'straight'},
{shoulder:12,waist:11,hip:19,torso:'pear'},
{shoulder:15,waist:19,hip:17,torso:'oval'}
];
const i=Math.max(0,Math.min(4,SIL.findIndex(x=>x.s===s&&x.w===w&&x.h===h)));
const a=shapes[i],L=x=>30-x,R=x=>30+x;
let torso='';
if(a.torso==='taper') torso=`M24 20 Q${L(a.shoulder-2)} 21 ${L(a.shoulder)} 30 L${L(a.shoulder-2)} 43 Q${L(a.shoulder-3)} 48 ${L(a.waist)} 54 Q30 58 ${R(a.waist)} 54 Q${R(a.shoulder-3)} 48 ${R(a.shoulder-2)} 43 L${R(a.shoulder)} 30 Q${R(a.shoulder-2)} 21 36 20 Z`;
else if(a.torso==='athletic') torso=`M24 20 Q${L(a.shoulder-1)} 20 ${L(a.shoulder)} 29 L${L(a.shoulder-2)} 43 Q${L(a.shoulder-3)} 47 ${L(a.waist)} 53 L${L(a.hip)} 60 Q30 63 ${R(a.hip)} 60 L${R(a.waist)} 53 Q${R(a.shoulder-3)} 47 ${R(a.shoulder-2)} 43 L${R(a.shoulder)} 29 Q${R(a.shoulder-1)} 20 36 20 Z`;
else if(a.torso==='straight') torso=`M24 20 Q${L(a.shoulder)} 22 ${L(a.shoulder)} 30 L${L(a.shoulder)} 48 Q${L(a.waist)} 53 ${L(a.waist)} 57 L${L(a.hip)} 61 Q30 63 ${R(a.hip)} 61 L${R(a.waist)} 57 Q${R(a.waist)} 53 ${R(a.shoulder)} 48 L${R(a.shoulder)} 30 Q${R(a.shoulder)} 22 36 20 Z`;
else if(a.torso==='pear') torso=`M24 20 Q${L(a.shoulder)} 22 ${L(a.shoulder)} 30 L${L(a.shoulder-1)} 43 Q${L(a.waist)} 49 ${L(a.hip)} 58 L${L(a.hip)} 64 Q30 69 ${R(a.hip)} 64 L${R(a.hip)} 58 Q${R(a.waist)} 49 ${R(a.shoulder-1)} 43 L${R(a.shoulder)} 30 Q${R(a.shoulder)} 22 36 20 Z`;
else torso=`M24 20 Q${L(a.shoulder)} 22 ${L(a.shoulder)} 30 L${L(a.shoulder-1)} 43 Q${L(a.waist)} 48 ${L(a.waist)} 55 Q${L(a.waist-2)} 63 30 64 Q${R(a.waist-2)} 63 ${R(a.waist)} 55 Q${R(a.waist)} 48 ${R(a.shoulder-1)} 43 L${R(a.shoulder)} 30 Q${R(a.shoulder)} 22 36 20 Z`;
return `<svg viewBox='0 0 60 100' aria-hidden='true'><circle cx='30' cy='11' r='7' fill='currentColor' stroke='none'/><path d='${torso}' fill='currentColor' stroke='none'/><path d='M${L(a.hip)} 60 L${L(a.hip-2)} 76 L25 95 L30 95 L33 74 L35 95 L40 95 L${R(a.hip)} 76 L${R(a.hip)} 60 Z' fill='currentColor' stroke='none'/><path d='M${L(a.shoulder)} 30 L${L(a.shoulder+4)} 48 L${L(a.shoulder+1)} 50 L${L(a.shoulder-1)} 43 M${R(a.shoulder)} 30 L${R(a.shoulder+4)} 48 L${R(a.shoulder+1)} 50 L${R(a.shoulder-1)} 43' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'/></svg>`;
}
function bellyIcon(level){
const profiles=[
{belly:25,top:30,front:30},
{belly:28,top:31,front:32},
{belly:32,top:32,front:36},
{belly:37,top:33,front:40},
{belly:42,top:34,front:44}
];
const p=profiles[level-1];
return `<svg viewBox='0 0 60 100' aria-hidden='true'><circle cx='26' cy='11' r='7' fill='currentColor' stroke='none'/><path d='M22 20 Q16 22 16 30 L14 44 Q13 49 17 51 L20 43 L22 57 L${p.top} 57 Q${p.front} 52 ${p.belly} 43 L${p.belly-2} 34 Q${p.belly-2} 25 30 21 Z' fill='currentColor' stroke='none'/><path d='M22 57 L22 73 L19 94 L25 94 L29 72 L32 94 L38 94 L35 72 L35 57 Z' fill='currentColor' stroke='none'/><path d='M18 31 L12 47 L16 49 L21 39 M30 22 Q${p.belly-1} 26 ${p.belly-2} 34' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round'/></svg>`;
}
let saved={};
try{saved=JSON.parse(localStorage.getItem('razmerchik_profile')||'{}')}catch(e){}
const state=Object.assign({h:175,w:70,sil:2,bel:1},saved);
function renderOpts(id,list,k,mk){
const el=document.getElementById(id);
el.innerHTML='';
list.forEach((o,i)=>{
const d=document.createElement('div');
d.className='opt'+(state[k]===i?' on':'');
d.innerHTML=mk(o)+o.n;
d.onclick=()=>{state[k]=i;render();};
el.appendChild(d);
});
}
function render(){
document.getElementById('h').value=state.h;
document.getElementById('w').value=state.w;
document.getElementById('hv').textContent=state.h;
document.getElementById('wv').textContent=state.w;
renderOpts('sil',SIL,'sil',o=>icon(o.s,o.w,o.h));
renderOpts('bel',BEL,'bel',o=>bellyIcon(BEL.indexOf(o)+1));
const sil=SIL[state.sil],bel=BEL[state.bel];
const scale=0.55+(state.h-140)/70*0.45;
const bulk=(state.w-40)/110;
const k=0.8+bulk*0.6;
const s=sil.s*k,w=(sil.w+bel.w)/2*k,h=sil.h*k;
document.getElementById('fig').innerHTML=icon(s,w,h).replace('<svg ',`<svg style='fill:#a9a595;height:${(200*scale).toFixed(0)}px' `);
}
document.getElementById('h').oninput=e=>{state.h=+e.target.value;render();};
document.getElementById('w').oninput=e=>{state.w=+e.target.value;render();};
document.querySelectorAll('.ctl button').forEach(b=>{b.onclick=()=>{state[b.dataset.t]+=+b.dataset.d;render();};});
document.getElementById('save').onclick=()=>{
try{localStorage.setItem('razmerchik_profile',JSON.stringify(state));}catch(e){}
document.getElementById('note').textContent='Профиль сохранён ✓';
if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');
};
render();
</script>
</body>
</html>
