<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Размерчик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#141418;--card:#222228;--text:#f2f0ea;--muted:#8d8b86;--gold:#d4b97a;--accent:#7a1f33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.fig{display:flex;justify-content:center;margin:6px 0 14px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;color:var(--muted)}
.val{font-size:30px;font-weight:700;color:var(--text)}
.val small{font-size:14px;color:var(--muted);margin-left:4px;font-weight:400}
.ctl{display:flex;align-items:center;gap:10px;margin-top:6px}
.ctl button{width:44px;height:44px;border-radius:10px;border:1px solid #333;background:var(--card);color:var(--text);font-size:22px}
input[type=range]{flex:1;accent-color:var(--gold);height:30px}
.label{color:var(--muted);margin:20px 0 8px}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opt{background:var(--card);border:1px solid #333;border-radius:10px;padding:8px 2px 6px;text-align:center;font-size:11px;color:var(--text)}
.opt svg{width:34px;height:56px;display:block;margin:0 auto 4px;fill:#d9d6cc}
.opt.on{background:#f2f0ea;color:#111}
.opt.on svg{fill:#111}
.main{width:100%;margin-top:24px;padding:15px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
.note{margin-top:12px;color:var(--gold);text-align:center;min-height:20px;font-size:14px}
</style>
</head>
<body>
<h1>Размерчик</h1>
<div class="sub">Заполни профиль один раз — дальше подберём размер</div>

<div class="fig" id="fig"></div>

<div class="row"><span>Рост</span><span class="val"><span id="hv">175</span><small>см</small></span></div>
<div class="ctl"><button data-t="h" data-d="-1">−</button><input id="h" type="range" min="140" max="210" value="175"><button data-t="h" data-d="1">+</button></div>

<div class="row"><span>Вес</span><span class="val"><span id="wv">70</span><small>кг</small></span></div>
<div class="ctl"><button data-t="w" data-d="-1">−</button><input id="w" type="range" min="40" max="150" value="70"><button data-t="w" data-d="1">+</button></div>

<div class="label">Силуэт</div>
<div class="opts" id="sil"></div>

<div class="label">Живот</div>
<div class="opts" id="bel"></div>

<button class="main" id="save">Сохранить профиль</button>
<div class="note" id="note"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const SIL = [
  {n:'Трапеция', s:18, w:12, h:11},
  {n:'Атлет',    s:21, w:12, h:13},
  {n:'Прямой',   s:15, w:15, h:15},
  {n:'Груша',    s:12, w:13, h:19},
  {n:'Овал',     s:15, w:20, h:16}
];
const BEL = [
  {n:'Плоский', w:11},
  {n:'Лёгкий',  w:13},
  {n:'Средний', w:16},
  {n:'Заметный',w:19},
  {n:'Большой', w:22}
];

function icon(s, w, h) {
  const c = 30;
  return '<svg viewBox="0 0 60 100"><circle cx="30" cy="11" r="8"/>' +
    '<path stroke-linejoin="round" d="M' + (c - s) + ' 26 L' + (c + s) + ' 26 L' + (c + w) + ' 55 L' + (c + h) + ' 78 L' + (c + h * 0.7) + ' 98 L' + (c + 2) + ' 98 L' + c + ' 80 L' + (c - 2) + ' 98 L' + (c - h * 0.7) + ' 98 L' + (c - h) + ' 78 L' + (c - w) + ' 55 Z"/></svg>';
}

const state = Object.assign({h:175, w:70, sil:2, bel:1}, JSON.parse(localStorage.getItem('razmerchik_profile') || '{}'));

function renderOpts(id, list, key, mk) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  list.forEach((o, i) => {
    const d = document.createElement('div');
    d.className = 'opt' + (state[key] === i ? ' on' : '');
    d.innerHTML = mk(o) + o.n;
    d.onclick = () => { state[key] = i; render(); };
    el.appendChild(d);
  });
}

function render() {
  document.getElementById('h').value = state.h;
  document.getElementById('w').value = state.w;
  document.getElementById('hv').textContent = state.h;
  document.getElementById('wv').textContent = state.w;
  renderOpts('sil', SIL, 'sil', o => icon(o.s, o.w, o.h));
  renderOpts('bel', BEL, 'bel', o => icon(14, o.w, 14));
  const sil = SIL[state.sil], bel = BEL[state.bel];
  const scale = 0.55 + (state.h - 140) / 70 * 0.45;
  const bulk = (state.w - 40) / 110;
  const s = sil.s * (0.8 + bulk * 0.6), w = (sil.w + bel.w) / 2 * (0.8 + bulk * 0.6), h = sil.h * (0.8 + bulk * 0.6);
  document.getElementById('fig').innerHTML = icon(s, w, h).replace('<svg ', '<svg style="fill:#a9a595;height:' + (200 * scale).toFixed(0) + 'px" ');
}

document.getElementById('h').oninput = e => { state.h = +e.target.value; render(); };
document.getElementById('w').oninput = e => { state.w = +e.target.value; render(); };
document.querySelectorAll('.ctl button').forEach(b => b.onclick = () => {
  const k = b.dataset.t; state[k] += +b.dataset.d; render();
});

document.getElementById('save').onclick = () => {
  try { localStorage.setItem('razmerchik_profile', JSON.stringify(state)); } catch (e) {}
  document.getElementById('note').textContent = 'Профиль сохранён ✓';
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
};

render();
</script>
</body>
</html>
