<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1'>
<title>Размерчик — подбор</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#141c30;--card2:#19243b;--text:#f3f6ff;--muted:#929db5;--line:rgba(160,177,220,.16);--gold:#a5b4fc;--accent:#6558f5;--accent2:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,rgba(101,88,245,.2),transparent 42%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:18px 16px 42px;letter-spacing:-.01em}
h1{font-size:27px;letter-spacing:-.045em;line-height:1.15;margin:8px 0 6px;font-weight:800}
.sub{color:var(--muted);font-size:14px;line-height:1.45;margin-bottom:20px}
.nav{display:flex;gap:5px;margin-bottom:24px;padding:5px;background:#10172a;border:1px solid var(--line);border-radius:15px}
.nav a{flex:1;text-align:center;padding:11px 8px;border-radius:11px;background:transparent;color:var(--muted);text-decoration:none;font-size:13px;font-weight:650;transition:background .2s,color .2s}
.nav a.on{background:linear-gradient(135deg,#8175ff,#5d55e9);color:white;box-shadow:0 5px 18px rgba(101,88,245,.24)}
.label{color:var(--text);font-size:15px;font-weight:750;margin:25px 0 7px;letter-spacing:-.02em}
.hint2{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:10px}
.seg{display:flex;gap:7px;margin:10px 0;padding:4px;background:#10172a;border:1px solid var(--line);border-radius:14px}
.seg button{flex:1;min-width:0;padding:11px 9px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;font-weight:650;transition:all .18s}
.seg button.on{background:linear-gradient(135deg,#8175ff,#5d55e9);color:#fff;box-shadow:0 4px 13px rgba(101,88,245,.2)}
.fld{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;color:#c4cce0;font-size:13px;font-weight:550;min-height:58px}
.fld input{width:100px;max-width:38%;background:#0d1426;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:17px;font-weight:700;padding:10px;text-align:right;outline:none}
.fld input:focus,textarea:focus{border-color:#8175ff;box-shadow:0 0 0 3px rgba(129,117,255,.12)}
textarea{display:block;width:100%;min-height:138px;background:var(--card);border:1px solid var(--line);border-radius:15px;color:var(--text);font-size:15px;line-height:1.6;padding:13px;font-family:inherit;outline:none;resize:vertical}
textarea::placeholder{color:#6f7b98}
.main{width:100%;margin-top:20px;padding:16px;border:0;border-radius:15px;background:linear-gradient(135deg,#8175ff,#5d55e9);color:#fff;font-size:15px;font-weight:750;letter-spacing:-.01em;box-shadow:0 9px 25px rgba(101,88,245,.24);transition:transform .15s,filter .15s}
.main:active,.sec:active{transform:scale(.985)}
.sec{background:var(--card);color:#cbd3e8;border:1px solid var(--line);border-radius:13px;padding:13px;width:100%;margin-top:11px;font-size:13px;line-height:1.45;font-weight:600}
.res{background:linear-gradient(145deg,rgba(101,88,245,.13),var(--card) 58%);border:1px solid rgba(129,117,255,.25);border-radius:18px;padding:17px;margin-top:17px;overflow:hidden}
.big{font-size:46px;font-weight:850;color:#b8b2ff;line-height:1.05;letter-spacing:-.05em;margin:7px 0}
.conf{margin:8px 0 14px;font-size:13px;line-height:1.5;font-weight:650}
.hi{color:#65e6b0}.mid{color:#f6c86b}.lo{color:#ff8d9b}
.det{font-size:13px;line-height:1.5;color:#aab5ce;margin:5px 0}
.tb{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}
.tb td{padding:10px 5px;border-top:1px solid var(--line);color:#aab5ce}
.tb td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tb tr.best td{color:#c5c0ff;font-weight:750}
@media(max-width:360px){body{padding-left:12px;padding-right:12px}.fld{padding:9px}.fld input{width:84px}.label{font-size:14px}}
</style>
</head>
<body>
<div class='nav'><a href='index.html'>Профиль</a><a class='on' href='match.html'>Подбор размера</a></div>
<h1>Подбор размера</h1>
<div class='sub'>Сравним мерки товара с твоей любимой вещью</div>

<div class='seg' id='modeSeg'><button data-m='top' class='on'>Верх</button><button data-m='bottom'>Низ</button></div>

<div class='label'>1. Твоя вещь, которая сидит идеально</div>
<div class='hint2'>Положи вещь плашмя и измерь ширину от шва до шва. Введёшь один раз, дальше запомнится.</div>
<div id='ref'></div>

<div class='label'>2. Таблица размеров товара</div>
<div class='hint2'>Мерки в таблице магазина:</div>
<div class='seg' id='circSeg'><button data-c='0' class='on'>Плашмя</button><button data-c='1'>Обхват</button></div>
<div class='hint2' id='hint'></div>
<textarea id='tbl' placeholder='S 50 68&#10;M 52 70&#10;L 54 72&#10;XL 56 74'></textarea>

<button class='main' id='go'>Подобрать размер</button>
<div id='out'></div>

<button class='sec' id='copy'>В карточке нет таблицы? Скопировать сообщение продавцу</button>

<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
const NL=String.fromCharCode(10);
const MODES={
top:{fields:[{k:'chest',n:'Ширина по груди',w:2,c:1},{k:'len',n:'Длина',w:1,c:0}]},
bottom:{fields:[{k:'waist',n:'Ширина по поясу',w:2,c:1},{k:'hip',n:'Ширина по бёдрам',w:1.5,c:1},{k:'len',n:'Длина по внутреннему шву',w:1,c:0}]}
};
let mode='top',circ=false;
const $=id=>document.getElementById(id);
const key=()=>'razmerchik_ref_'+mode;
function loadRef(){try{return JSON.parse(localStorage.getItem(key())||'{}')}catch(e){return {}}}
function renderRef(){
const f=MODES[mode].fields,r=loadRef();
$('ref').innerHTML=f.map(x=>`<label class='fld'><span>${x.n}, см</span><input type='number' inputmode='decimal' step='0.5' data-k='${x.k}' value='${r[x.k]===undefined?'':r[x.k]}'></label>`).join('');
$('ref').querySelectorAll('input').forEach(i=>{i.oninput=()=>{const r2=loadRef();r2[i.dataset.k]=i.value===''?undefined:parseFloat(i.value);try{localStorage.setItem(key(),JSON.stringify(r2))}catch(e){}}});
$('hint').textContent='Порядок цифр в строке: размер, '+f.map(x=>x.n.toLowerCase()).join(', ');
}
function num(t){
t=t.replace(/,+$/,'').replace(',','.');
const m=t.match(/^([0-9]+([.][0-9]+)?)[-–]([0-9]+([.][0-9]+)?)$/);
if(m)return(parseFloat(m[1])+parseFloat(m[3]))/2;
return /^[0-9]+([.][0-9]+)?$/.test(t)?parseFloat(t):NaN;
}
function parseTable(text,n){
const lines=text.split(String.fromCharCode(13)).join('').split(NL);
return lines.map(l=>l.split(';').join(' ').split(String.fromCharCode(9)).join(' ').split(' ').filter(Boolean)).filter(t=>t.length>1).map(t=>({label:t[0].replace(/,+$/,''),vals:t.slice(1,1+n).map(num)})).filter(r=>r.vals.length&&r.vals.every(v=>!isNaN(v)));
}
const msg=t=>`<div class='res'>${t}</div>`;
const fmt=v=>v.toFixed(1).replace('.0','');
function calc(){
const f=MODES[mode].fields,ref=loadRef(),out=$('out');
const rows=parseTable($('tbl').value,f.length);
if(!f.some(x=>typeof ref[x.k]==='number')){out.innerHTML=msg('Сначала введи мерки своей вещи в первом шаге.');return;}
if(rows.length<2){out.innerHTML=msg('Вставь хотя бы две строки таблицы, например: M 52 70');return;}
const m=Math.min.apply(null,rows.map(r=>r.vals.length));
const res=rows.map(r=>{
let total=0;const det=[];
f.slice(0,m).forEach((x,i)=>{
if(typeof ref[x.k]!=='number')return;
let v=r.vals[i];
if(circ&&x.c)v=v/2;
const d=v-ref[x.k];
total+=Math.abs(d)*x.w;
det.push({n:x.n,d:d,v:v});
});
return {label:r.label,total:total,det:det};
}).filter(r=>r.det.length);
if(!res.length){out.innerHTML=msg('Не получилось сопоставить: проверь, что цифры идут в нужном порядке.');return;}
const sorted=res.slice().sort((a,b)=>a.total-b.total);
const best=sorted[0],second=sorted[1];
const maxAbs=Math.max.apply(null,best.det.map(d=>Math.abs(d.d)));
const gap=second?second.total-best.total:99;
let cls='lo',txt='Низкая уверенность: ни один размер не совпал близко. Лучше уточнить замеры у продавца.';
if(maxAbs<=1.5&&gap>=1){cls='hi';txt='Высокая уверенность: брать можно.';}
else if(maxAbs<=3){cls='mid';txt='Средняя уверенность: отличие от эталона пара сантиметров.';}
const det=best.det.map(d=>`<div class='det'>${d.n}: ${fmt(d.v)} см, ${Math.abs(d.d)<0.25?'как у твоей вещи':fmt(Math.abs(d.d))+' см '+(d.d>0?'больше':'меньше')+' твоей вещи'}</div>`).join('');
const tb=`<table class='tb'>${res.map(r=>`<tr class='${r===best?'best':''}'><td>${r.label}</td><td>отклонение ${fmt(r.total)}</td></tr>`).join('')}</table>`;
out.innerHTML=`<div class='res'><div class='hint2'>Твой размер</div><div class='big'>${best.label}</div><div class='conf ${cls}'>${txt}</div>${det}${tb}</div>`;
out.scrollIntoView({behavior:'smooth'});
}
document.querySelectorAll('#modeSeg button').forEach(b=>{b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b));$('out').innerHTML='';renderRef();}});
document.querySelectorAll('#circSeg button').forEach(b=>{b.onclick=()=>{circ=b.dataset.c==='1';document.querySelectorAll('#circSeg button').forEach(x=>x.classList.toggle('on',x===b));}});
$('go').onclick=calc;
$('copy').onclick=()=>{
const names=MODES[mode].fields.map(x=>x.n.toLowerCase()).join(', ');
const t='Здравствуйте! Пришлите, пожалуйста, замеры изделия в сантиметрах (плашмя): '+names+'. Хочу подобрать размер.';
const done=()=>{$('copy').textContent='Скопировано ✓ Отправь продавцу'};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>{$('copy').textContent=t});}else{$('copy').textContent=t;}
};
renderRef();
</script>
</body>
</html>
